[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sizerec"
version = "0.0.0"
description = "Size recommendation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2.3",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "ipykernel>=6.25",
  "jupyterlab>=4.0",
  "torch>=2.2",
  "pyyaml>=6.0",
  "xlstm>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]